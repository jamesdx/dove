## Step-by-Step Process 步骤分解

1. Domain Discovery Phase 领域发现阶段
   - Conduct domain expert interviews 领域专家访谈
     ```prompt
     Role: You are a domain expert interviewer with expertise in DDD
     Goal: Extract key domain knowledge and establish ubiquitous language
     Context: [Specific business domain]
     Questions to ask:
     1. What are the core business processes?
     2. What terms and concepts are commonly used?
     3. What are the business rules and constraints?
     4. What are the key performance indicators?
     5. What are the pain points in current processes?
     ```

   - Create ubiquitous language dictionary 创建通用语言词典
     ```prompt
     Role: You are a DDD analyst and language curator
     Task: Create a comprehensive ubiquitous language dictionary
     Input: Domain expert interview notes
     Output format:
     - Term: [Business term]
     - Definition: [Clear definition]
     - Context: [Usage context]
     - Related terms: [Associated concepts]
     - Examples: [Real-world examples]
     ```

2. Strategic Design Phase 战略设计阶段
   - Define bounded contexts 定义限界上下文
     ```prompt
     Role: You are a DDD strategic designer
     Task: Identify and define bounded contexts
     Consider:
     1. Business capability boundaries
     2. Team organizational boundaries
     3. Data ownership boundaries
     4. Integration patterns between contexts
     Output:
     - Context name
     - Responsibility
     - Core domain elements
     - Integration requirements
     ```

3. Tactical Design Phase 战术设计阶段
   - Model aggregates and entities 建模聚合和实体
     ```prompt
     Role: You are a DDD tactical designer
     Task: Design aggregates and entities
     For each aggregate:
     1. Identify the aggregate root
     2. Define entity boundaries
     3. Specify invariants
     4. Design lifecycle events
     5. Document business rules
     ```

4. Implementation Phase 实现阶段
   - Project structure setup 项目结构设置
     ```prompt
     Role: You are a software architect
     Task: Define microservice project structure
     Deliverables:
     1. Domain layer structure
     2. Application service layer
     3. Infrastructure layer
     4. API contracts
     5. Cross-cutting concerns
     ```

5. Testing & Deployment 测试和部署
   - Test strategy design 测试策略设计
     ```prompt
     Role: You are a test architect
     Task: Design comprehensive test strategy
     Coverage:
     1. Domain logic unit tests
     2. Aggregate integration tests
     3. Bounded context tests
     4. End-to-end scenarios
     5. Performance benchmarks
     ```

6. Maintenance & Evolution 维护和演进
   - System monitoring 系统监控
     ```prompt
     Role: You are a DevOps engineer
     Task: Define monitoring strategy
     Monitor:
     1. Domain event flows
     2. Aggregate consistency
     3. Bounded context integration
     4. Business metrics
     5. Technical metrics
     ```

## Prompt Engineering Guidelines Prompt工程指南

When creating prompts for each phase:

1. Role Definition 角色定义
   - Clearly specify the expert role
   - Define the expertise level
   - State the responsibility scope

2. Context Setting 上下文设置
   - Business domain background
   - Current phase objectives
   - Available resources
   - Constraints and limitations

3. Task Structure 任务结构
   - Clear goal statement
   - Step-by-step instructions
   - Expected deliverables
   - Quality criteria

4. Output Format 输出格式
   - Structured response template
   - Required sections
   - Examples and references
   - Validation checklist

5. Iteration Guidance 迭代指导
   - Feedback incorporation
   - Refinement criteria
   - Next steps
   - Continuous improvement

